# Docs KwikTalk — statique Nuxt/Nitro (NITRO_PRESET=static)
# Port 3000 : le routeur Traefik de Dokploy pointe déjà sur 3000 (domaine kwiktalk-docs.applix.fr).
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Sans ça, nginx émet des Location absolus avec le port interne 3000
    # (http://host:3000/en) qui cassent la redirection derrière Traefik/443.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # "/" : même comportement que le node-server précédent (302 vers la locale par défaut).
    # index.html existe aussi (meta refresh) mais le 302 est propre côté crawlers.
    location = / {
        return 302 /en;
    }

    # Assets hashés par Nuxt — cache immutable.
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Chaque route est un dossier avec index.html (nitro autoSubfolderIndex),
    # d'où $uri/index.html pour les URLs sans slash final (/en/overview/pricing).
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
